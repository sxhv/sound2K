# Builds the Windows installer on GitHub's servers and attaches it to a
# draft Release. Runs when you push a version tag (e.g. v0.2.0), or by hand
# from the Actions tab. Uses only GitHub's built-in token; no other secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sound2K ${{ github.ref_name }}"
          releaseBody: "Download **Sound2K_…_x64-setup.exe** below and run it. Installs for your user only (no admin needed)."
          releaseDraft: true
          prerelease: false
