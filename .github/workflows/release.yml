# Builds the Windows installer on GitHub's servers and attaches it to a
# draft Release named after the app version (e.g. v0.2.0). Start it with the
# "Run workflow" button in the Actions tab, or by pushing a version tag. Signs the update with the TAURI_SIGNING_PRIVATE_KEY
# secret so installed copies can update themselves (latest.json).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Updater files are only built here (local builds don't need the key).
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          # __VERSION__ = the version in tauri.conf.json; the tag is created
          # when you publish the release.
          tagName: v__VERSION__
          releaseName: "Sound2K v__VERSION__"
          releaseBody: "Download **Sound2K_…_x64-setup.exe** below and run it. Installs for your user only (no admin needed)."
          releaseDraft: true
          prerelease: false
